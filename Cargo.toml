[package]
name = "araea-wordcloud"
version = "0.1.13"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Araea"]
description = "Rust 词云库：把带权词语排布成 SVG 或 PNG。"
categories = ["visualization", "multimedia::images", "graphics"]
repository = "https://github.com/araea/araea-wordcloud"
keywords = ["wordcloud", "visualization", "image", "svg", "graphics"]
readme = "README.md"

[dependencies]
rand = "0.10"
usvg = "0.48"
image = "0.25"
resvg = "0.48"
fontdue = "0.9"
tiny-skia = "0.12"
thiserror = "2.0"
rand_chacha = "0.10"

# ==============================================================================
# Examples
# ==============================================================================

[[example]]
name = "simple"
path = "examples/simple.rs"

[[example]]
name = "mask_shape"
path = "examples/mask_shape.rs"

[[example]]
name = "advanced"
path = "examples/advanced.rs"

[[example]]
name = "chinese_dense"
path = "examples/chinese_dense.rs"

[[example]]
name = "trim"
path = "examples/trim.rs"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
